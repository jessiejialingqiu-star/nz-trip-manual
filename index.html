<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新西兰自驾与悉尼过境手册 (2026)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-sub: #64748b;
      --primary: #0284c7;
      --primary-light: #e0f2fe;
      --accent: #f59e0b;
      --danger: #ef4444;
      --border: #e2e8f0;
      --tag-bg: #f1f5f9;
      --drive-tag-bg: #e0f2fe;
      --drive-tag-text: #0369a1;
      --transit-tag-bg: #ede9fe;
      --transit-tag-text: #6d28d9;
      --gas-tag-bg: #fef3c7;
      --gas-tag-text: #b45309;
      --food-lunch-bg: #fef2f2;
      --food-lunch-text: #b91c1c;
      --food-dinner-bg: #f0fdf4;
      --food-dinner-text: #15803d;
      --rule-bg: #fff7ed;
      --rule-border: #ffedd5;
      --rule-text: #9a3412;
      --spot-bg: #f8fafc;
      --map-bg: #f0f9ff;
      --sidebar-bg: #ffffff;
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-sub: #94a3b8;
        --primary: #38bdf8;
        --primary-light: #082f49;
        --accent: #fbbf24;
        --danger: #f87171;
        --border: #334155;
        --tag-bg: #334155;
        --drive-tag-bg: #0c4a6e;
        --drive-tag-text: #bae6fd;
        --transit-tag-bg: #4c1d95;
        --transit-tag-text: #ddd6fe;
        --gas-tag-bg: #78350f;
        --gas-tag-text: #fef3c7;
        --food-lunch-bg: #450a0a;
        --food-lunch-text: #fecaca;
        --food-dinner-bg: #052e16;
        --food-dinner-text: #bbf7d0;
        --rule-bg: #431407;
        --rule-border: #7c2d12;
        --rule-text: #fed7aa;
        --spot-bg: #1e293b;
        --map-bg: #082f49;
        --sidebar-bg: #1e293b;
        --shadow: 0 4px 12px rgba(0,0,0,0.3);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .top-bar h1 { font-size: 1.05rem; font-weight: 800; }
    .menu-btn {
      background: none;
      border: none;
      font-size: 1.35rem;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 8px;
    }
    
    .app-layout {
      display: flex;
      min-height: calc(100vh - 54px);
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(3px);
      z-index: 48;
      display: none;
    }
    .sidebar-overlay.active { display: block; }
    
    .sidebar {
      width: 250px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      z-index: 50;
    }
    
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0; bottom: 0;
        left: -260px;
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .sidebar.open { transform: translateX(260px); }
    }
    
    .sidebar-header {
      padding: 0 8px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .sidebar-header .sub { font-size: 0.75rem; color: var(--text-sub); }
    
    .nav-tab {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-sub);
      text-decoration: none;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-tab:hover { background-color: var(--tag-bg); color: var(--text); }
    .nav-tab.active { background-color: var(--primary-light); color: var(--primary); font-weight: 700; }
    .nav-tab .tab-icon { font-size: 1.15rem; }
    
    .content-area {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 60px;
      width: 100%;
    }
    
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    
    .focus-card {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border: none;
    }
    @media (prefers-color-scheme: dark) {
      .focus-card { background: linear-gradient(135deg, #0369a1, #0f172a); border: 1px solid var(--border); }
    }
    .focus-badge {
      display: inline-block;
      font-size: 0.72rem;
      background: rgba(255,255,255,0.2);
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .focus-title { font-size: 1.15rem; font-weight: 700; margin: 8px 0 4px; }
    .focus-desc { font-size: 0.85rem; opacity: 0.9; }
    .countdown-timer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      justify-content: space-between;
    }
    .countdown-unit {
      flex: 1;
      background: rgba(0,0,0,0.18);
      padding: 8px 4px;
      border-radius: 10px;
      text-align: center;
    }
    .countdown-num { font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .countdown-label { font-size: 0.65rem; text-transform: uppercase; opacity: 0.8; }
    
    .sec-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .map-box { text-align: center; overflow: hidden; }
    svg { width: 100%; height: auto; display: block; }
    
    .day-map-preview {
      background: var(--map-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    
    .booking-grid { display: flex; flex-direction: column; gap: 10px; }
    .booking-item {
      padding: 12px;
      background: var(--tag-bg);
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .booking-head { font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 4px; }
    .booking-detail { color: var(--text-sub); line-height: 1.5; }
    
    .day-card { margin-bottom: 18px; }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .day-title { font-size: 1.05rem; font-weight: 800; }
    .day-nav-link {
      font-size: 0.75rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .timeline-row {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .time-col {
      min-width: 50px;
      font-weight: 700;
      color: var(--primary);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .content-col { flex: 1; }
    .loc-link {
      color: var(--text);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 3px;
    }
    
    .drive-badge, .transit-badge, .gas-badge, .food-lunch-badge, .food-dinner-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      margin: 2px 0 4px;
    }
    .drive-badge { background-color: var(--drive-tag-bg); color: var(--drive-tag-text); }
    .transit-badge { background-color: var(--transit-tag-bg); color: var(--transit-tag-text); }
    .gas-badge { background-color: var(--gas-tag-bg); color: var(--gas-tag-text); font-weight: 700; }
    .food-lunch-badge { background-color: var(--food-lunch-bg); color: var(--food-lunch-text); font-weight: 700; }
    .food-dinner-badge { background-color: var(--food-dinner-bg); color: var(--food-dinner-text); font-weight: 700; }
    .drive-connector { display: flex; align-items: center; margin: -2px 0 6px 62px; }
    
    .tag-must-book { display: inline-block; font-size: 0.65rem; color: #fff; background: var(--danger); padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-left: 4px; }
    .tag-booked { display: inline-block; font-size: 0.65rem; color: #fff; background: #10b981; padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-left: 4px; }
    
    .hotel-bar {
      margin-top: 14px;
      padding: 10px 12px;
      background: var(--tag-bg);
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hotel-bar-icon { font-size: 1.1rem; flex-shrink: 0; }
    
    .spots-guide {
      margin-top: 12px;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }
    .spots-guide-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .spot-item {
      background: var(--spot-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 0.82rem;
    }
    .spot-item:last-child { margin-bottom: 0; }
    .spot-item-name { font-weight: 700; margin-bottom: 3px; color: var(--primary); }
    .spot-item-desc { color: var(--text); margin-bottom: 4px; }
    .spot-item-tips { color: var(--text-sub); font-size: 0.78rem; line-height: 1.4; }
    
    .rule-card {
      background: var(--rule-bg);
      border: 1px solid var(--rule-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--text);
    }
    .rule-title { font-weight: 700; color: var(--rule-text); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    
    ul.checklist { list-style: none; }
    ul.checklist li {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      display: flex;
      gap: 8px;
    }
    ul.checklist li:last-child { border-bottom: none; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex-shrink: 0; }
    
    .packing-group { margin-bottom: 16px; }
    .packing-group-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .pack-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }
    .pack-item:last-child { border-bottom: none; }
    .pack-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .pack-item.checked span {
      text-decoration: line-through;
      color: var(--text-sub);
      opacity: 0.6;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="menu-btn" onclick="toggleSidebar()" aria-label="打开菜单">☰</button>
  <h1 id="topbar-title">📅 具体行程</h1>
  <div style="width: 24px;"></div>
</div>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div style="font-weight: 800; font-size: 1.05rem;">🇳🇿 新西兰自驾手册</div>
      <div class="sub">2026.09.24 – 10.05</div>
    </div>
    <button class="nav-tab active" onclick="switchTab('tab-itinerary', '📅 具体行程')">
      <span class="tab-icon">📅</span><span>具体行程</span>
    </button>
    <button class="nav-tab" onclick="switchTab('tab-bookings', '📑 凭证总览')">
      <span class="tab-icon">📑</span><span>凭证总览</span>
    </button>
    <button class="nav-tab" onclick="switchTab('tab-rules', '🚦 交规避坑法则')">
      <span class="tab-icon">🚦</span><span>自驾交规法则</span>
    </button>
    <button class="nav-tab" onclick="switchTab('tab-checklist', '📝 待办与行李')">
      <span class="tab-icon">📝</span><span>待办与行李</span>
    </button>
    <button class="nav-tab" onclick="switchTab('tab-tips', '💡 实用贴士')">
      <span class="tab-icon">💡</span><span>实用贴士</span>
    </button>
  </aside>

  <main class="content-area">

    <!-- ==================== TAB 1: 具体行程 ==================== -->
    <section class="tab-pane active" id="tab-itinerary">
      <div class="card focus-card">
        <span class="focus-badge">NEXT MILESTONE</span>
        <div class="focus-title" id="next-title">计算行程航向中...</div>
        <div class="focus-desc" id="next-desc">--:--</div>
        <div class="countdown-timer">
          <div class="countdown-unit"><div class="countdown-num" id="cd-days">00</div><div class="countdown-label">Days</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-hours">00</div><div class="countdown-label">Hours</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-mins">00</div><div class="countdown-label">Mins</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-secs">00</div><div class="countdown-label">Secs</div></div>
        </div>
      </div>

      <div class="sec-title">🗺️ 新西兰南岛自驾拓扑图</div>
      <div class="card map-box">
        <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
          <path d="M 50 130 Q 80 110 100 100 T 165 75 T 215 55 T 305 35" fill="none" stroke="var(--border)" stroke-width="6" stroke-linecap="round"/>
          <circle cx="50" cy="130" r="7" fill="#0284c7" />
          <text x="50" y="150" font-size="9" fill="currentColor" text-anchor="middle" font-weight="bold">Queenstown (3N)</text>
          
          <circle cx="100" cy="100" r="6" fill="#f59e0b" />
          <text x="100" y="90" font-size="9" fill="currentColor" text-anchor="middle" font-weight="bold">Wānaka (1N)</text>
          
          <circle cx="165" cy="75" r="6" fill="#10b981" />
          <text x="165" y="65" font-size="9" fill="currentColor" text-anchor="middle" font-weight="bold">Twizel (2N)</text>
          
          <circle cx="215" cy="55" r="6" fill="#8b5cf6" />
          <text x="215" y="45" font-size="9" fill="currentColor" text-anchor="middle" font-weight="bold">Tekapo (1N)</text>
          
          <circle cx="305" cy="35" r="7" fill="#ef4444" />
          <text x="305" y="25" font-size="9" fill="currentColor" text-anchor="middle" font-weight="bold">Christchurch (2N)</text>
          
          <text x="180" y="170" font-size="8.5" fill="var(--text-sub)" text-anchor="middle">南岛纯净自驾 ➔ 基督城还车 ➔ 悉尼过境漫步</text>
        </svg>
      </div>

      <div class="sec-title
